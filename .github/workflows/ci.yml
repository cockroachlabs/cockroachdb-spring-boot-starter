name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Always compiled by GraalVM 25 to Java 17 bytecode; the matrix varies the
    # JVM the tests run on (17 = oldest supported runtime). Gradle itself runs
    # on the matrix JDK, so the getting-started guides (included builds with no
    # toolchain of their own) are tested on it too. Example apps under examples/
    # are built too; they pin their own toolchain and download it if missing.
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      # GraalVM 25 compiles the starter (Gradle toolchain, found via GRAALVM_HOME).
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Set up last so it is JAVA_HOME: Gradle, the starter tests and the guides
      # all run on this JVM.
      - name: Set up JDK ${{ matrix.java }} (test runtime)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds the starter, every guide and every example. Tests use Testcontainers, which starts
      # CockroachDB containers on the runner's Docker daemon — no manual service.
      - name: Build & test
        run: ./gradlew build -PtestJvm=${{ matrix.java }} --no-daemon --stacktrace

  # Stable-named gate for branch protection: require "CI OK" instead of the
  # matrix job names, so matrix changes don't strand the required check.
  ci-ok:
    name: CI OK
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.build.result }}" = "success" ]'
