name: examples-it

# Runs the Ideas Board example's integration tests on GitHub-hosted runners,
# which ship with Docker — so Testcontainers spins up a real CockroachDB and the
# tutorial's integration tests (the 40001 concurrency proof, follower reads,
# metrics, CDC) actually execute. The example is a standalone Gradle project that
# depends on the PUBLISHED starter 0.3.0 from the anonymous Pages Maven feed, so
# this never builds the starter itself. Multi-region and vector ITs stay gated:
# they need a multi-region cluster / a v25.2+ image, so they SKIP here.
on:
  pull_request:
    paths:
      - 'examples/ideas-board/**'
      - '.github/workflows/examples-it.yml'
  push:
    branches: [main]
    paths:
      - 'examples/ideas-board/**'
      - '.github/workflows/examples-it.yml'
  workflow_dispatch:

jobs:
  ideas-board-it:
    name: Ideas Board integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Temurin 17 matches the example's declared Java toolchain
      # (examples/ideas-board/build.gradle), so it both runs Gradle 9.8 and
      # satisfies the toolchain with no auto-provisioning.
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Integration tests (real CockroachDB via Testcontainers)
        working-directory: examples/ideas-board
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        # The example has no wrapper of its own; use the root gradlew against the
        # example project dir (its own settings.gradle makes it a separate build).
        run: ../../gradlew test --no-daemon
