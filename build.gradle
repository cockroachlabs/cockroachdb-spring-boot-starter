plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cockroachlabs'
version = '0.2.0'

// Build with GraalVM 25, but emit (and compile against the API of) Java 17 so the
// starter runs on any Java 17+ JVM. `release` rejects newer JDK APIs at compile
// time; source/targetCompatibility alone would not.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        nativeImageCapable = true
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('-release', '17')
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.1"
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework:spring-aop'
    api 'org.aspectj:aspectjweaver'
    api 'org.springframework:spring-tx'
    api 'org.springframework:spring-jdbc'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'io.micrometer:micrometer-core'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.springframework:spring-web'
    compileOnly 'tools.jackson.core:jackson-databind'
    compileOnly 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.springframework.ai:spring-ai-vector-store'
    compileOnly 'org.springframework.ai:spring-ai-model'

    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation 'org.springframework:spring-web'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-cockroachdb'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.postgresql:postgresql'
}

// Tests run on the oldest supported JVM by default; CI overrides with -PtestJvm=21/25.
def testJvm = (findProperty('testJvm') ?: '17') as int

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJvm)
    }
    useJUnitPlatform()
    // TestJvmTest asserts the forked JVM really is this version and prints it.
    systemProperty 'expectedTestJvm', testJvm
    addTestOutputListener({ descriptor, event ->
        if (descriptor.className?.endsWith('.TestJvmTest')) {
            logger.lifecycle(event.message.trim())
        }
    } as TestOutputListener)
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.cockroachlabs'
            artifactId = 'cockroachdb-spring-boot-starter'
            from components.java
            pom {
                name = 'CockroachDB Spring Boot Starter'
                description = 'Spring Boot starter for CockroachDB with retry, metrics, and concurrency testing'
                url = 'https://github.com/cockroachlabs/cockroachdb-spring-boot-starter'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/cockroachlabs/cockroachdb-spring-boot-starter'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
        // Anonymous static Maven repo published to GitHub Pages (no token to
        // consume). The Javadoc/Pages workflow copies this into _site/maven.
        maven {
            name = 'Pages'
            url = layout.buildDirectory.dir('maven-repo')
        }
    }
}
