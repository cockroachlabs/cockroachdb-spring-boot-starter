# tag::config[]
spring:
  datasource:
    url: jdbc:postgresql://localhost:26257/ideas?sslmode=disable
    username: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

# tag::actuator-config[]
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
# end::actuator-config[]
# end::config[]
