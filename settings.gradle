plugins {
    // Downloads missing JDK toolchains (GraalVM 25 to build, JDK 17 to test).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'cockroachdb-spring-boot-starter'

// Each getting-started guide (guides/<slug>/initial and complete) is a standalone
// build. Including them here builds and tests them with this build, and
// includeBuild('.') lets them resolve the starter from this checkout instead of
// the published release.
includeBuild('.')
file('guides').eachDir { guide ->
    ['initial', 'complete'].each { stage ->
        includeBuild("guides/${guide.name}/${stage}") {
            name = "${guide.name}-${stage}"
        }
    }
}
